name: Signal Conditioning Simulation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  simulate-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run Signal Conditioning Circuit Simulation
      run: |
        python scripts/simulate_signal_conditioning.py

    - name: Verify Generated Datasets
      run: |
        test -f hardware/simulation_data.csv && echo "Simulation CSV verification passed."
